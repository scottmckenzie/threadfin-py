[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "threadfin"
version = "0.1.0"
description = "Python port of Threadfin: an M3U proxy and EPG mapper for Plex/Emby/Jellyfin"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "starlette>=0.37",
    "uvicorn>=0.30",
]

[project.scripts]
threadfin = "threadfin.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.0",  # starlette.testclient
    "pytest>=9",  # unittest subTest reported per subtest
    "ruff>=0.17",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/threadfin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]  # webfixture
filterwarnings = ["error"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
