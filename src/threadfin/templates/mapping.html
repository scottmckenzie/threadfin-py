{% extends "base.html" %}
{% block content %}
<section class="card">
  <div class="heading"><h1>Mapping</h1></div>
  <form class="toolbar" hx-get="/web/mapping/rows" hx-target="#rows" hx-trigger="load, submit, input delay:300ms from:find input[name=q], change from:find select[name=state], change from:find select[name=group], refresh-list from:body">
    <input name="q" type="search" placeholder="Search name, number, tvg-id" aria-label="Search">
    <select name="state" aria-label="Show">
      <option value="active">Active</option><option value="inactive">Inactive</option>
      <option value="hidden">Hidden</option><option value="all">All</option>
    </select>
    <select name="group" aria-label="Group">
      <option value="">All groups</option>
      {% for g in groups %}<option value="{{ g }}">{{ g }}</option>{% endfor %}
    </select>
  </form>
  <form id="bulk" hx-post="/web/mapping/bulk" hx-swap="none" hx-disinherit="*">
    <div class="toolbar">
      <span class="muted">With the selected channels:</span>
      <select name="action" aria-label="Bulk action">
        <option value="">Choose…</option>
        <option value="activate">Activate</option><option value="deactivate">Deactivate</option>
        <option value="hide">Hide</option><option value="unhide">Show again</option>
        <option value="category">Set EPG category to…</option>
        <option value="group">Set group title to…</option>
        <option value="renumber">Number from…</option>
      </select>
      <input name="value" placeholder="value" aria-label="Value" list="category-values">
      <datalist id="category-values">{% for label, value in categories %}<option value="{{ value }}">{{ label }}</option>{% endfor %}</datalist>
      <button type="submit">Apply</button>
    </div>
    <div id="rows"><p class="muted">Loading…</p></div>
  </form>
</section>
{% endblock %}
